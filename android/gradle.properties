# How much memory a build may take.
#
# This asked for -Xmx8G with a 4G metaspace, so the Gradle daemon was
# entitled to 12G on a 15.6G machine. A JVM grows its heap as it needs it and
# never gives it back, so after one release build the daemon sat at 4.5G
# indefinitely - and Gradle keeps daemons alive for three hours by default.
# The machine was left with 1.4G free and everything else on it crawling.
#
# 3G is comfortably more than this build measures at, and a fifth of the
# machine rather than three quarters of it. Raise it if a build ever dies
# with "Java heap space" - that message is unambiguous, and guessing high to
# avoid ever seeing it is what caused this.
#
# Metaspace is 512m, not 4G: it holds loaded class metadata, and a Gradle
# build does not come close to 512m. The old number was not a measurement.
#
# HeapDumpOnOutOfMemoryError is gone deliberately. With a smaller heap an OOM
# is likelier, and the dump it writes is the size of the heap - a 3G file
# dropped into the project on a machine already short of space, which helps
# nobody who is not debugging the JVM itself.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m

# Kotlin compiles in its own daemon with its own heap, which this never
# capped. It is the second java process in Task Manager.
kotlin.daemon.jvmargs=-Xmx1G

# Let an idle daemon go after 15 minutes instead of Gradle's default three
# hours. The cost of a cold start is a few seconds on the next build; the
# cost of the default is gigabytes held all afternoon after one build.
org.gradle.daemon.idletimeout=900000
org.gradle.java.home=C\:/Users/ATUL/.jdks/corretto-17.0.20.1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
